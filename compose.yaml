services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-EmergencyIntelligencePrototype/2.0 example@example.com}
      INCLUDE_PRESCRIBED_FIRES: ${INCLUDE_PRESCRIBED_FIRES:-false}
      WATCH_DUTY_PRESCRIBED_BURNS_ENABLED: ${WATCH_DUTY_PRESCRIBED_BURNS_ENABLED:-true}
      RADIO_INTELLIGENCE_ENABLED: ${RADIO_INTELLIGENCE_ENABLED:-false}
      RADIO_INTELLIGENCE_URL: ${RADIO_INTELLIGENCE_URL:-}
      RADIO_INTELLIGENCE_TOKEN: ${RADIO_INTELLIGENCE_TOKEN:-}
      POWEROUTAGE_ENABLED: ${POWEROUTAGE_ENABLED:-false}
      POWEROUTAGE_API_URL: ${POWEROUTAGE_API_URL:-}
      POWEROUTAGE_API_KEY: ${POWEROUTAGE_API_KEY:-}
      POWEROUTAGE_AUTH_HEADER: ${POWEROUTAGE_AUTH_HEADER:-Authorization}
      POWEROUTAGE_AUTH_SCHEME: ${POWEROUTAGE_AUTH_SCHEME:-Bearer}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-2.3.0}
      CONFIG_DIR: /app/config
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
